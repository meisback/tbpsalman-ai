<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBP Salman AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;height:100vh;display:flex;flex-direction:column}
.header{background:#111;padding:20px;text-align:center;font-size:32px;font-weight:bold;color:#00ff00;border-bottom:3px solid #00ff00}
.chat-box{flex:1;overflow-y:auto;padding:20px}
.message{max-width:80%;padding:15px;margin:10px 0;border-radius:15px;font-size:18px}
.ai{background:#222;border-left:6px solid #00ff00}
.user{background:#00ff00;color:#000;margin-left:auto}
.input-area{display:flex;padding:15px;background:#111}
input{flex:1;padding:15px;border:none;outline:none;border-radius:30px;background:#222;color:#fff;font-size:18px}
button{width:70px;height:70px;border:none;border-radius:50%;background:#00ff00;font-size:30px;cursor:pointer}
</style>
</head>
<body>

<div class="header">TBP Salman AI Assistant</div>

<div class="chat-box" id="chatBox">
<div class="message ai">হ্যালো ভাই! আমি TBP Salman AI Assistant। যেকোনো প্রশ্ন করতে পারো।</div>
</div>

<div class="input-area">
<input type="text" id="userInput" placeholder="Type a message...">
<button onclick="sendMessage()">➜</button>
</div>

<script>
const localAnswers={
"hi":"Hi! কেমন আছো?",
"hello":"Hello! আমি TBP Salman AI।",
"how are you":"আমি ভালো আছি। তুমি কেমন আছো?",
"kemon acho":"আমি ভালো আছি। তুমি কেমন আছো?",
"বাংলাদেশ স্বাধীন হয় কত সালে":"বাংলাদেশ ১৯৭১ সালে স্বাধীনতা লাভ করে।",
"bangladesh swadhin hoy koto sale":"বাংলাদেশ ১৯৭১ সালে স্বাধীনতা লাভ করে।",
"তোমাকে কে তৈরি করেছে":"আমাকে তৈরি করেছে Salman এবং তার বন্ধু Ashraful Islam।",
"tomake ke toiri koreche":"আমাকে তৈরি করেছে Salman এবং তার বন্ধু Ashraful Islam।",
"তোমার বন্ধু কে":"আমার বন্ধু Ashraful Islam।",
"tomar bondhu ke":"আমার বন্ধু Ashraful Islam।"
};

function getReply(text){
let t=text.toLowerCase();

if(t.includes("ki korte paro")||t.includes("ki korte paren")||t.includes("কি করতে পারো")||t.includes("কি করতে পারেন"))
return "আমি প্রশ্নের উত্তর দিতে এবং সাহায্য করতে পারি।";

if(t.includes("salman"))
return "Salman আমার Creator এবং Owner।";

if(t.includes("ashraful"))
return "Ashraful Islam আমার বন্ধু।";

return localAnswers[t] || "দুঃখিত, এই প্রশ্নের উত্তর আমার ডাটাবেজে নেই।";
}

function sendMessage(){
let input=document.getElementById("userInput");
let text=input.value.trim();
if(!text) return;

let chat=document.getElementById("chatBox");

chat.innerHTML+=`<div class="message user">${text}</div>`;
input.value="";

setTimeout(()=>{
chat.innerHTML+=`<div class="message ai">${getReply(text)}</div>`;
chat.scrollTop=chat.scrollHeight;
},500);
}

document.getElementById("userInput").addEventListener("keypress",function(e){
if(e.key==="Enter") sendMessage();
});
</script>

</body>
</html>
